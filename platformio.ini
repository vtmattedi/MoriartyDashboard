; PlatformIO Project Configuration File
;
; NightMare Network dashboard, handheld: the panel in a battery enclosure.
; Target: Sunton ESP32-3248S035C -- ESP32-WROOM-32 (4MB flash, no PSRAM),
; ST7796 320x480 SPI display, GT911 capacitive touch, RGB LED, CDS sensor,
; plus a 1M/1M battery divider wired to GPIO 35.
;
; Native ESP-IDF, no Arduino. Kconfig choices are in sdkconfig.defaults, which
; is source; the sdkconfig.<env> PlatformIO generates from it is not.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-3248S035C]
; Feature selection for NightMareNetwork lives in include/NightMareConfig.h.
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; NightMare's logger colours lines with ANSI codes; the default filter would
; print each ESC as a visible character.
monitor_filters =
	direct
	send_on_enter
monitor_echo = yes
; Two 0x1F0000 OTA slots + a 64KB filesystem partition for the settings store.
; The firmware was cut to fit this: the weather icons went from 64 to 48 square
; and the rest screen's logo from 180 to 128, which is 160,944 bytes of pixel
; data. See tools/lvglresize.py for why fewer pixels rather than a smaller pixel
; format.
board_build.partitions = src/OtaDual.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 2031616

build_flags =
	; NightMareNetwork ships no creds.h of its own, and picks up an optional
	; include/NightMareConfig.h through __has_include -- so include/ has to be on
	; the include path of the *library* build too, not just of src/. Version.h is
	; reached the same way, which is how NM_FIRMWARE_VERSION gets set.
	-I include
	; lv_conf.h lives in lib/, next to the lvgl folder rather than inside it,
	; so both it and LVGL itself have to be reachable by a plain include.
	-I lib
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	; NightMareNetwork speaks std::string through ArduinoJson.
	-D ARDUINOJSON_ENABLE_STD_STRING=1
	; Board + panel selection, consumed by lib/boardstuff -- pins, SPI clock
	; and the ST7796 setup all live there now, not here.
	-D ESP32_3248S035C
	; Portrait: 320x480. Touch follows DISPLAY_ROTATION automatically, so this
	; is the only place orientation is chosen. TFT_ORIENTATION_PORTRAIT_INV is
	; the same axis flipped 180 degrees, for an enclosure that holds the board
	; the other way up. The layout is portrait-only: the landscape macros still
	; rotate the panel correctly but the screens are no longer laid out for them.
	-D TFT_ORIENTATION_PORTRAIT
	-Wno-unused-variable

lib_deps =
	; The library's own main branch, which builds on native ESP-IDF. Never edit
	; the copy PlatformIO puts under .pio/libdeps -- change
	; nightmare/lib/nightmarenetwork and bump (see the umbrella AGENTS.md).
	https://github.com/vtmattedi/NightMareNetwork.git

extra_scripts =
	pre:src/Version/script.py
	pre:tools/cxxflags.py
