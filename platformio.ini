; PlatformIO Project Configuration File
;
; NightMare Network wall dashboard.
; Target: Sunton ESP32-3248S035C -- ESP32-WROOM-32 (4MB flash, no PSRAM),
; ST7796 320x480 SPI display, GT911 capacitive touch, RGB LED, CDS sensor.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-3248S035C]
; Arduino-ESP32 core 3.x / ESP-IDF 5.x is required, not optional:
; NightMareNetwork's MQTT module uses the nested esp_mqtt_client_config_t
; (.broker / .credentials / .session), which only exists from IDF 5.0 on.
; Feature selection for the library lives in include/NightMareConfig.h.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
	send_on_enter
	esp32_exception_decoder
; Two 0x1F0000 OTA slots + a 64KB LittleFS partition for Configs. The firmware
; was cut to fit this: the weather icons went from 64 to 48 square and the rest
; screen's logo from 180 to 128, which is 160,944 bytes of pixel data. See
; tools/lvglresize.py for why fewer pixels rather than a smaller pixel format.
board_build.partitions = src/OtaDual.csv
board_build.f_flash = 80000000L

build_flags =
	; NightMareNetwork ships no creds.h of its own, and picks up an optional
	; include/NightMareConfig.h through __has_include -- so include/ has to be on
	; the include path of the *library* build too, not just of src/. Version.h is
	; reached the same way, which is how NM_FIRMWARE_VERSION gets set.
	-I include
	; lv_conf.h lives in lib/, next to the lvgl folder rather than inside it,
	; so both it and LVGL itself have to be reachable by a plain include.
	-I lib
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	; Board + panel selection, consumed by lib/boardstuff.
	-D ESP32_3248S035C
	; Landscape: 480x320. Touch follows DISPLAY_ROTATION automatically, so this
	; is the only place orientation is chosen. TFT_ORIENTATION_LANDSCAPE_INV is
	; the same axis flipped 180 degrees if the image comes out upside down.
	-D TFT_ORIENTATION_LANDSCAPE
	; --- TFT_eSPI panel setup -------------------------------------------------
	; Configured here rather than by editing the library's User_Setup.h, so the
	; dependency stays a clean registry package that can be updated in place.
	-D USER_SETUP_LOADED=1
	-D ST7796_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	; The panel's reset is tied to the board reset -- there is no GPIO for it.
	; (GPIO 26, which some setups use here, is this board's speaker output.)
	-D TFT_RST=-1
	; The backlight is GPIO 27, driven as PWM by boardstuff. TFT_BL is
	; deliberately left undefined so TFT_eSPI never drives it: the value often
	; copied for this board, GPIO 32, is actually the GT911 touch I2C clock.
	-D SPI_FREQUENCY=65000000
	-D SPI_READ_FREQUENCY=20000000
	; LVGL renders all text itself; TFT_eSPI is only a pixel pusher, so none of
	; its own fonts need to be compiled in. LOAD_GLCD alone keeps it happy.
	-D LOAD_GLCD=1
	; -------------------------------------------------------------------------
	-Wno-unused-variable

lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git
	bblanchon/ArduinoJson@^7.0.0
	bodmer/TFT_eSPI@^2.5.43

; --- Framework configuration -------------------------------------------------

; Setting custom_sdkconfig makes pioarduino rebuild Arduino as an ESP-IDF
; component ("HybridCompile") instead of linking the prebuilt libraries. The
; first build after changing anything here is long -- it compiles the whole of
; IDF -- and every later one is normal.
;
; It is worth it because the prebuilt Arduino libraries fix the two settings
; that decide whether this panel can hold a TLS connection, and neither can be
; reached any other way. Measured on hardware: joining the network costs ~137KB
; and leaves ~4KB free with a ~1.6KB largest block, and a reconnect then fails
; in mbedtls_ssl_handshake with -0x2700 -- which is not a certificate problem
; but an allocation failing inside certificate verification, which is how
; mbedtls_x509_crt_verify reports running out of memory.
; DISABLED, AND NOT REACHABLE FROM A WINDOWS HOST. Uncommenting this block is
; still the single biggest win available to this panel -- an estimated 40-50KB,
; against a board that has ~4KB free once it has joined the network -- and every
; setting below was verified to apply cleanly to the generated sdkconfig. What
; stops it is the toolchain, and after two attempts on 2026-09-23 the reason is
; structural rather than a matter of versions:
;
;   Tool Manager: Installing .../scons-4.8.1.zip
;   [WinError 32] tool-scons/scons-local-4.11.1/SCons/Tool/ninja_tool/
;   Methods.py: the process cannot access the file
;   ImportError: cannot import name 'Node' from 'SCons.Node' (unknown location)
;
; HybridCompile pins tool-scons 4.8.1, so the platform tries to delete the
; installed 4.11.1 first -- and SCons is executing out of that directory at the
; time. Windows will not unlink a file that is open, so the tree is half removed,
; 4.8.1 is unpacked over the remains, PlatformIO reinstalls 4.11.1 on top, and
; what is left is two SCons versions interleaved that cannot import themselves.
; On Linux the same sequence works, because a running file can be unlinked there.
; No setting on this machine changes that.
;
; And behind it, unchanged: 4.8.1 is the version that does not run under this
; machine's Python 3.14, with ModuleNotFoundError: No module named
; 'SCons.Tool.FortranCommon'. Two independent blockers, either enough on its own.
;
; To pick this up: build this variant on Linux or WSL, where replacing the
; running SCons is legal and a Python matching scons 4.8.1 is easy to arrange.
; Enable Windows Developer Mode first if the build host stays Windows (the IDF
; component manager needs symlinks), delete managed_components/,
; dependencies.lock, CMakeLists.txt and sdkconfig.defaults, then uncomment.
; Note that turning it on also pulls espressif__esp-dsp and friends into the
; project root, which want gitignoring if this ever becomes a repository.
;
; Paths above use forward slashes deliberately: a comment line ending in a
; backslash is a line continuation to the INI parser, and the next line then
; becomes a bogus configuration key.
;
; custom_sdkconfig =
;	; The big one. Without it every TLS connection holds a 16KB input and a 16KB
;	; output record buffer, each one contiguous, for as long as it is open. With
;	; it mbedTLS allocates them per record and frees them in between, which is
;	; roughly 25-30KB back in steady state and, more importantly, stops the two
;	; largest contiguous blocks on the board being permanently spoken for.
;	CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
;	; The certificate chain and the config data are copied into the session and
;	; then never read again. These free them once the handshake is done.
;	CONFIG_MBEDTLS_DYNAMIC_FREE_PEER_CERT=y
;	CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
;	; TLS requires a peer to accept 16KB records, so the input buffer keeps its
;	; full size. Nothing this panel sends comes close, so the output half is cut
;	; to 4KB -- 12KB back, with no protocol risk, because the limit applies only
;	; to what we emit.
;	CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
;	CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
;	CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
;	; The WiFi driver sizes its buffers for throughput this panel will never
;	; use: it carries a few hundred bytes a second of MQTT. The Arduino
;	; prebuilts ship 8 static / 32 dynamic RX and 16 static TX.
;	CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
;	CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
;	CONFIG_ESP32_WIFI_STATIC_TX_BUFFER_NUM=8

extra_scripts =
	pre:src/Version/script.py
	pre:tools/cxxflags.py
